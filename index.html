 if(!window._est||typeof S==='undefined'||!S.Q||!S.Q.itens)return null;

 const hl=ha*pl/100,hc=ha-hl,avisos=[];
 let rC=rc,rL=rl;

return mk(v=>v.ac,'Por drone','Drone')+mk(v=>v.pil,'Por piloto','Piloto')+hint('Todos os valores em ha/h com paradas. As colunas Comum e Lento separam o efeito do terreno (entre parênteses, nº de voos). Compare drones e pilotos no mesmo estilo; o geral depende de onde cada um voou.')}

h+=sec('Baterias',`<div class="kp"><div>Voos com bateria<b>${t.n}</b></div><div>Gasto médio/voo<b>${f1(t.pv)}%</b></div><div>ha por bateria<b>${f1(t.hb)}</b></div><div>Baterias por ha<b>${f1(t.bh*10)}<small>/10 ha</small></b></div></div>`+

tb(['Drone','Voos','% por voo','ha/bateria'],grp(B,v=>v.ac||null).map(g=>{const b=bs(g.L);return[esc(g.l),b.n,f1(b.pv),f1(b.hb)]}))+
hint(`"ha por bateria" considera uma bateria cheia (100%). Entraram ${t.n} de ${d.F.length} voo(s); os sem dado de bateria ficaram de fora.`));

function cProd(m){const T=m.T,best=m.dk.reduce((b,k)=>!b||m.days[k].a.ha>m.days[b].a.ha?k:b,'');
