return mk(v=>v.ac,'Por drone','Drone')+mk(v=>v.pil,'Por piloto','Piloto')+hint('Todos os valores em ha/h com paradas. As colunas Comum e Lento separam o efeito do terreno (entre parênteses, nº de voos). Compare drones e pilotos no mesmo estilo; o geral depende de onde cada um voou.')}
function vBat(d){const T=agg(d.F),dias=T.days.size||1,x=dv(T),pd=T.ng/dias,rvAll=T.min?T.ha/(T.min/60):0,eh=pd/60*rvAll,vm=x.vmed,tot=T.min+T.gap;

const bs=a=>{let g=0,ha=0;a.forEach(v=>{g+=v.b0-v.b1;ha+=v.ha});return{n:a.length,g,ha,pv:a.length?g/a.length:0,hb:g?ha/(g/100):0,bh:ha?g/100/ha:0}};
const t=bs(B);
h+=sec('Baterias',`<div class="kp"><div>Voos com bateria<b>${t.n}</b></div><div>Gasto médio/voo<b>${f1(t.pv)}%</b></div><div>ha por bateria<b>${f1(t.hb)}</b></div><div>Baterias por ha<b>${f1(t.bh*10)}<small>/10 ha</small></b></div></div>`+
tb(['Estilo','Voos','% por voo','ha/bateria'],['cm','cp','mid'].map(k=>{const L=B.filter(v=>v.st==k);if(!L.length)return null;const b=bs(L);return[NM[k],b.n,f1(b.pv),f1(b.hb)]}).filter(Boolean))+
tb(['Drone','Voos','% por voo','ha/bateria'],grp(B,v=>v.ac||null).map(g=>{const b=bs(g.L);return[esc(g.l),b.n,f1(b.pv),f1(b.hb)]}))+
hint(`"ha por bateria" considera uma bateria cheia (100%). Entraram ${t.n} de ${d.F.length} voo(s); os sem dado de bateria ficaram de fora.`));
return h}
function vHor(d){const ed=[7,9,11,13,15,17],lb=['Antes das 7h','7h–9h','9h–11h','11h–13h','13h–15h','15h–17h','Depois das 17h'];

let h=sec('Por horário de início do voo',tb(['Faixa','Voos','ha','ha/h','Comum'],bk.filter(b=>b.L.length).map(b=>{const a=agg(b.L),c=agg(b.L.filter(v=>v.st=='cm'));return[b.l,a.n,f1(a.ha),f1(dv(a).rate),c.n?f1(dv(c).rate):'—']}))+hint('A coluna Comum isola o terreno comum, para o horário não se misturar com o tipo de voo.'));
const C=grp(d.F,v=>(v.cul||'').trim()||'(sem cultura)').map(g=>({l:g.l,a:agg(g.L)})).sort((x,y)=>y.a.ha-x.a.ha);

const days=d.days,dk=Object.keys(days).sort().reverse().slice(0,30),CL=(S.C&&S.C.clima)||{},tags=['Sem vento','Vento moderado','Vento forte','Calor forte'];
const G={};Object.keys(days).forEach(k=>{const t=CL[k]||'Sem marcação',x=days[k],g=G[t]=G[t]||{d:0,ha:0,m:0};g.d++;g.ha+=x.ha;g.m+=x.min+x.gap});

`<div style="margin-top:10px">${dk.map(k=>`<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="flex:1;font-weight:600">${dt(k)} <small style="color:var(--gy)">${f1(days[k].ha)} ha</small></span><select style="width:55%;margin:0" onchange="maisClima('${k}',this.value)"><option value="">—</option>${tags.map(t=>`<option ${CL[k]==t?'selected':''}>${t}</option>`).join('')}</select></label>`).join('')}</div>`);
