<script>
/* ---------- estimador de prazo no orçamento (usa o histórico de voos do Smart Farm) ---------- */
(()=>{
const hh=m=>{const r=Math.round(m);return Math.floor(r/60)+'h'+String(r%60).padStart(2,'0')};
const sec=document.querySelector('#s_qs');if(!sec)return;
sec.insertAdjacentHTML('afterend',`<section id="s_qe"><div class="sh"><span class="nb">⏱</span><h2>Estimativa de prazo</h2></div>
<div class="gr"><label>Hectares (vazio = soma dos serviços)<input data-qe="ha" inputmode="decimal" autocomplete="off"></label><label>Tipo de voo<select data-qe="t"><option value="cm">Comum</option><option value="cp">Lento (complicado)</option><option value="mx">Misto</option></select></label><label id="qe_pll">% da área em voo lento<input data-qe="pl" inputmode="decimal" autocomplete="off"></label><label>Margem de segurança (%)<input data-qe="mg" inputmode="decimal" autocomplete="off"></label></div>
<div class="sum" id="qe_r" style="margin-top:12px"></div><p class="hint" id="qe_h"></p><button class="s" id="qe_b" style="width:100%;margin-top:8px">Usar no campo Prazo de execução</button></section>`);
const E=()=>{const q=S.Q||{};return q.est=q.est||{}};
const val=(k,d)=>{const e=E();return e[k]!=null&&e[k]!==''?e[k]:d};
function sync(){document.querySelectorAll('#s_qe [data-qe]').forEach(i=>{const k=i.dataset.qe;i.value=k=='t'?val('t','cm'):k=='mg'?val('mg','15'):k=='pl'?val('pl','50'):val(k,'')});vis()}
function vis(){const l=document.getElementById('qe_pll');if(l)l.hidden=val('t','cm')!='mx'}
let CUR=null;
function calcE(){
 if(!window._est||typeof S==='undefined'||!S.Q||!S.Q.itens)return null;
 const d=_est.tudo(),T=d.T;if(!T.n)return{vazio:1};
 const der=_est.der,all=der(T),rc=d.E.cm.n?der(d.E.cm).rate:0,rl=d.E.cp.n?der(d.E.cp).rate:0;
 const ha=n(val('ha',''))>0?n(val('ha','')):qv(S.Q).ha;
 const t=val('t','cm'),pl=t=='cp'?100:t=='mx'?Math.min(100,Math.max(0,n(val('pl','50')))):0,mg=Math.max(0,n(val('mg','15')));
 const hl=ha*pl/100,hc=ha-hl,avisos=[];
 let rC=rc,rL=rl;
 if(hc>0&&!rC){rC=all.rate;avisos.push('Ainda não há voos classificados como Comum; usei o rendimento geral.')}
 if(hl>0&&!rL){rL=all.rate;avisos.push('Ainda não há voos classificados como Lento; usei o rendimento geral.')}
 if(hc>0&&d.E.cm.n<10)avisos.push('Poucos voos no estilo Comum ('+d.E.cm.n+'). A estimativa ainda é frágil.');
 if(hl>0&&d.E.cp.n<10)avisos.push('Poucos voos no estilo Lento ('+d.E.cp.n+'). A estimativa ainda é frágil.');
 const horas=((hc>0&&rC?hc/rC:0)+(hl>0&&rL?hl/rL:0))*(1+mg/100),hpd=T.d.size?all.h/T.d.size:0,dias=hpd>0&&horas>0?Math.max(1,Math.ceil(horas/hpd-0.05)):0;
 return{ha,horas,dias,hpd,rC,rL,n:T.n,nd:T.d.size,avisos,pl,t}}
function R(){const r=document.getElementById('qe_r'),h=document.getElementById('qe_h'),b=document.getElementById('qe_b');if(!r)return;
 CUR=calcE();
 if(!CUR){r.textContent='';h.textContent='';b.disabled=true;return}
 if(CUR.vazio){r.textContent='Sem voos importados ainda.';h.textContent='Importe a planilha do Smart Farm na aba Relatório para o app aprender o seu rendimento.';b.disabled=true;return}
 if(!(CUR.ha>0)){r.textContent='Informe os hectares (no serviço acima ou neste campo).';h.textContent='';b.disabled=true;return}
 r.innerHTML=`${fmt(CUR.ha)} ha ≈ <b>${hh(CUR.horas*60)}</b> de drone · cerca de <b>${CUR.dias} dia(s)</b> de trabalho`;
 h.innerHTML=`Base: ${CUR.n} voos em ${CUR.nd} dia(s). Rendimento com paradas: comum ${CUR.rC?fmt(CUR.rC)+' ha/h':'—'}, lento ${CUR.rL?fmt(CUR.rL)+' ha/h':'—'}. Dia médio do seu histórico: ${hh(CUR.hpd*60)} de drone (soma dos drones).${CUR.avisos.length?'<br>⚠ '+CUR.avisos.join('<br>⚠ '):''}`;
 b.disabled=!CUR.dias}
document.getElementById('s_qe').addEventListener('input',e=>{const k=e.target.dataset.qe;if(!k)return;E()[k]=e.target.value;if(k=='t')vis();R();if(typeof saveQ==='function')saveQ()});
document.getElementById('qe_b').addEventListener('click',()=>{if(!CUR||!CUR.dias)return;S.Q.prazo='Cerca de '+CUR.dias+' dia(s) de trabalho após a aprovação';syncF();if(typeof saveQ==='function')saveQ();if(typeof toast==='function')toast('Prazo preenchido')});
const _c=window.calcQ;if(typeof _c==='function')window.calcQ=function(){const r=_c.apply(this,arguments);try{R()}catch(e){}return r};
const _f=window.qfill;if(typeof _f==='function')window.qfill=function(){const r=_f.apply(this,arguments);try{sync();R()}catch(e){}return r};
const _g=window.go;if(typeof _g==='function')window.go=async function(t){const r=await _g.apply(this,arguments);if(t=='q'){try{sync();R()}catch(e){}}return r};
try{sync();R()}catch(e){}
})();
</script>
