<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--g:#0f3d2a;--g2:#1f7a4d;--g3:#34a56d;--lt:#e8f3ed;--lt2:#f4f8f5;--bg:#f2f5f3;--tx:#14201a;--gy:#667085;--bd:#dce5df;--ok:#067647;--okb:#d1fadf;--pa:#b54708;--pab:#fef0c7;--pe:#b42318;--peb:#fee4e2;--r:14px;--sh:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(150px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;padding:10px 16px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.lg{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}

header h1{font-size:17px;margin:0;font-weight:700;line-height:1.2}header small{opacity:.8;font-size:12px;display:block}
.pill{font-size:11px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{background:rgba(255,255,255,.14);color:#fff;padding:7px 10px;border-radius:999px;font-size:13px;white-space:nowrap;font-weight:600}
.chips button.on{background:#fff;color:var(--g)}
.chips button i{font-style:normal;font-size:11px;background:rgba(0,0,0,.2);border-radius:999px;padding:1px 6px;margin-left:4px}
.chips button.on i{background:var(--lt);color:var(--g)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--g2);color:#fff;font-weight:600;cursor:pointer;transition:transform .1s,opacity .1s}
button:active{transform:scale(.98);opacity:.85}button:disabled{opacity:.4;pointer-events:none}
button.s{background:#fff;color:var(--g);border:1px solid var(--bd)}button.d{background:var(--peb);color:var(--pe)}button.t{background:none;color:var(--g2);padding:6px 8px}
main{max-width:800px;margin:0 auto;padding:12px}
section{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
[id^=s_]{scroll-margin-top:120px}
h2{font-size:15px;margin:0 0 10px;color:var(--g);font-weight:700}h2.lh{margin:16px 2px 8px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sh h2{margin:0;flex:1}
.nb{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.ck{font-size:12px;font-weight:700}.ck.ok{color:var(--ok);background:var(--okb);padding:2px 10px;border-radius:999px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.two{display:flex;gap:8px;margin-bottom:12px}.two button{flex:1}

input,select,textarea{width:100%;margin-top:3px;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g3);outline-offset:-1px;border-color:var(--g3)}textarea{min-height:76px}
.op{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--lt2)}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--g)}
.sum{background:var(--lt);border-radius:10px;padding:10px;font-weight:600;color:var(--g);margin:8px 0}

.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.mod.on{display:flex}

.spn{width:38px;height:38px;border:4px solid var(--lt);border-top-color:var(--g2);border-radius:50%;margin:6px auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.fc{background:#fff;color:var(--tx);border:2px solid var(--bd);text-align:left;padding:14px;border-radius:12px}.fc b{display:block;font-size:17px;color:var(--g)}.fc small{display:block;font-weight:400;color:var(--gy);margin-top:2px;font-size:12px}
.fc.on{border-color:var(--g2);background:var(--lt)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}.th img{width:100%;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left;vertical-align:top}.tb .r{text-align:right;white-space:nowrap}.tb tr.lk{cursor:pointer}.ov{overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:0 0 12px}.kp div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:12px;color:var(--gy)}.kp b{display:block;font-size:17px;color:var(--g)}
.rc{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}.rt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:16px}.rm{color:var(--gy);font-size:13px}
.rn{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}.bd.ok{background:var(--okb);color:var(--ok)}.bd.pa{background:var(--pab);color:var(--pa)}.bd.pe{background:var(--peb);color:var(--pe)}
.bd.gy{background:#eef2f0;color:#475467}
.cnt{font-size:11px;font-weight:700;background:var(--lt);color:var(--g);border-radius:999px;padding:2px 9px;white-space:nowrap}
mark{background:#fde68a;border-radius:3px;padding:0 1px}.em{text-align:center;color:var(--gy);padding:28px 12px;background:#fff;border:1px dashed var(--bd);border-radius:14px}
.br{display:block;height:7px;background:var(--lt);border-radius:4px;margin-top:3px}.br i{display:block;height:100%;background:var(--g2);border-radius:4px}
summary{cursor:pointer;font-weight:600;color:var(--g2);padding:10px 0 4px}
.sbx{position:relative}.sbx svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--gy);fill:none;stroke-width:2;stroke-linecap:round}
.sbx input{margin:0;padding-left:40px;font-size:17px}
.fxs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.fch{background:var(--g);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600;display:inline-flex;gap:8px;align-items:center}.fch b{background:rgba(255,255,255,.22);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;cursor:pointer;font-size:11px}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.qk button{padding:7px 12px;font-size:13px;border-radius:999px}.qk button.on{background:var(--g);color:#fff;border-color:var(--g)}
</style></head><body>
<div class="top"><header><div class="hl"><div class="lg"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><path d="M7 7l2.5 2.5M17 7l-2.5 2.5M7 17l2.5-2.5M17 17l-2.5-2.5"/></svg></div><div style="min-width:0"><h1>Relatórios de Aplicação</h1><small id="num"></small></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="pill" id="sst"></span><span class="pill" id="cst" onclick="sync(1)" style="cursor:pointer">☁</span></div></header>
<div class="chips" id="chips"></div></div>
<main>
<div class="pn" id="p_f"><div class="two"><button class="s" onclick="novo()">＋ Novo relatório</button><button class="s" onclick="limpar()">Limpar campos</button></div><div id="app"></div></div>
<div class="pn" id="p_b" hidden></div><div class="pn" id="p_r" hidden></div><div class="pn" id="p_q" hidden></div><div class="pn" id="p_a" hidden></div>
</main>
<div class="bar" id="actbar"><button class="s" onclick="sv()">Salvar</button><button class="pdf" id="pdfb" onclick="openFmt()">GERAR RELATÓRIO</button></div>
<div class="bar" id="qbar" style="display:none"><button class="s" onclick="sq()">Salvar</button><button class="pdf" onclick="openFmt('orc')">ENVIAR ORÇAMENTO</button></div>
<nav class="tabs">
<button data-t="f" class="on" onclick="go('f')"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Relatório</button>
<button data-t="q" onclick="go('q')"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orçamento</button>
<button data-t="b" onclick="go('b')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Buscar</button>
<button data-t="r" onclick="go('r')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Resumo</button>
<button data-t="a" onclick="go('a')"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<!-- escolha do formato -->
<div class="mod" id="mf"><div class="mb"><h2>Gerar relatório</h2><p style="margin:0;color:var(--gy);font-size:13px">Escolha em qual formato você quer o relatório.</p>
<div class="fcs" id="fmt"><button class="fc on" data-v="pdf" onclick="pickF('pdf')"><b>PDF</b><small>Ideal para imprimir e enviar por e-mail</small></button><button class="fc" data-v="img" onclick="pickF('img')"><b>Imagem</b><small>Ideal para WhatsApp e redes</small></button></div>
<div id="fimg" hidden class="gr" style="margin-bottom:10px"><label>Tipo de imagem<select id="fi"><option value="png">PNG (melhor qualidade)</option><option value="jpg">JPG (arquivo menor)</option></select></label><label>Páginas<select id="fo"><option value="0">Uma imagem por página</option><option value="1">Uma imagem única (páginas juntas)</option></select></label></div>
<div style="display:grid;gap:8px"><button onclick="gen()" style="padding:14px;font-size:16px">Gerar agora</button><button class="s" onclick="cl('mf')">Cancelar</button></div></div></div>
<!-- resultado -->
<div class="mod" id="mp"><div class="mb"><h2>Relatório pronto</h2><p id="pn" style="word-break:break-all;margin-top:0"></p><div class="th" id="pth"></div>
<div style="display:grid;gap:8px"><button onclick="dl()">Baixar</button><button id="shb" onclick="shr()">Compartilhar</button><button class="s" id="wab" onclick="wa()">Enviar mensagem por WhatsApp</button><button class="s" id="mlb" onclick="ml()">Enviar por e-mail</button><button class="s" id="vwb" onclick="vw()">Visualizar</button><button class="s" onclick="cl('mp')">Fechar</button></div></div></div>
<div class="mod" id="bz" style="z-index:40"><div class="mb" style="text-align:center;max-width:300px"><div class="spn"></div><p id="bzt" style="margin:0;color:var(--gy)"></p></div></div>
<div class="mod on" id="lg" style="z-index:30;background:var(--g)"><div class="mb"><h2 id="lt">Entrar</h2><p id="ld" style="color:var(--gy);font-size:13px;margin-top:0">Use o e-mail e a senha da equipe.</p><label>E-mail<input id="lun" type="email" autocomplete="username" inputmode="email"></label><label style="margin-top:8px">Senha<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')lgo()"></label><p id="le" style="color:#b42318;min-height:18px;margin:8px 0"></p><button style="width:100%" id="lb" onclick="lgo()">Entrar</button></div></div>
<datalist id="dl_cli"></datalist><datalist id="dl_faz"></datalist><datalist id="dl_cid"></datalist><datalist id="dl_cul"></datalist><datalist id="dl_prod"></datalist><datalist id="dl_drone"></datalist><datalist id="dl_qs"><option value="Aplicação com drone"><option value="Aplicação de herbicida"><option value="Aplicação de fungicida"><option value="Aplicação de inseticida"><option value="Adubação foliar"><option value="Maturador"><option value="Semeadura com drone"></datalist>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=['Herbicida','Fungicida','Inseticida','Adubação foliar','Maturador','Semeadura','Outro'],CUL=['Soja','Milho','Algodão','Cana-de-açúcar','Café','Arroz','Trigo','Feijão','Sorgo','Pastagem','Eucalipto','Citros'];
const S={C:{},R:{},Q:{},P:{fmt:'pdf',img:'png',one:'0'}};
let OQ={},QS='e',DQ=0,tq,GD='rel',OUT,OU=[],tm,DIRTY=0,IX={},TB='f',SB='r',XL=[],AU;
let FL={q:'',a:'',b:'',st:'',cu:'',tp:'',ci:'',hmin:'',hmax:'',o:'rec',g:'n',gb:'fazenda',ex:null};
/* ---------- armazenamento (IndexedDB) ----------
   'r:<id>' = relatório completo (com imagens) · 'ix' = índice leve p/ busca · 'draft' · 'co' · 'n' · 'auth' · 'pref' */
const DB=new Promise((res,rej)=>{const q=indexedDB.open('dronerel',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>res(q.result);q.onerror=()=>rej()});DB.catch(()=>{});
const dbs=(k,v)=>DB.then(d=>new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r;t.onerror=r})).catch(()=>{});
const dbd=k=>DB.then(d=>new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').delete(k);t.oncomplete=r;t.onerror=r})).catch(()=>{});
const dbc=()=>DB.then(d=>new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').clear();t.oncomplete=r;t.onerror=r})).catch(()=>{});
const dbg=k=>DB.then(d=>new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>{});
const pill=t=>{$('#sst').textContent=t},hm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
let tsv,tsq;const save=()=>{DIRTY=1;pill('Editando…');clearTimeout(tsv);tsv=setTimeout(()=>sv(true),5000);clearTimeout(tm);tm=setTimeout(async()=>{await dbs('draft',S.R);await dbs('co',S.C);pill('Rascunho salvo '+hm())},700)};
/* ---------- utilidades ---------- */
const n=v=>parseFloat(String(v||0).replace(/\./g,m=>/,/.test(v)?'':m).replace(',','.'))||0;
const fmt=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:2}),brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),dt=d=>d?d.split('-').reverse().join('/'):'';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ymd(new Date());
const nz=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(),nt=t=>nz(t).trim();
const uniq=a=>{const m=new Map();a.forEach(v=>{const k=nt(v);if(k&&!m.has(k))m.set(k,String(v).trim())});return[...m.values()].sort((x,y)=>nz(x).localeCompare(nz(y)))};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)};
const cl=id=>$('#'+id).classList.remove('on'),tick=()=>new Promise(r=>setTimeout(r,30));
const busy=t=>{if(t){$('#bzt').textContent=t;$('#bz').classList.add('on')}else cl('bz')};
const rd=(f,m,q,png)=>new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL(png?'image/png':'image/jpeg',q))}catch(e){r(null)}URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);r(null)};im.src=u});
const newOp=()=>({tipo:T[0],itens:[{un:'L/ha'}]});
const norm=r=>{if(!r.ops||!r.ops.length)r.ops=[newOp()];r.fotos=r.fotos||[];if(!r.mapas)r.mapas=r.mapa?[{src:r.mapa,leg:r.mapaLeg||''}]:[];delete r.mapa;delete r.mapaLeg;return r};
const lite=r=>{const c={};for(const k in r)if(k!='fotos'&&k!='mapas'&&k!='mapa'&&k!='mapaLeg')c[k]=r[k];c.nf=(r.fotos||[]).length;c.nm=(r.mapas||[]).length+(r.mapa?1:0);return c};
const inp=(s,k,l,t,x)=>`<label>${l}<input data-s="${s}" data-k="${k}" autocomplete="off" ${t=='date'||t=='time'?'type="'+t+'"':'type="text" inputmode="'+(t=='n'?'decimal':t=='tel'?'tel':'text')+'"'} ${x||''}></label>`;
const sel=(s,k,l,o)=>`<label>${l}<select data-s="${s}" data-k="${k}">${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const sh=(i,t,id)=>`<div class="sh"><span class="nb">${i}</span><h2>${t}</h2><span class="ck" id="ck_${id}"></span></div>`;
/* ---------- interface do relatório ---------- */

function calc(){const R=S.R;if(!R.ops)return{ha:0,cl:0,ac:0,tot:0,fin:0,sal:0};let ha=0,cl=0;R.ops.forEach((o,i)=>{const h=n(o.ha),t=h*n(o.lha);ha+=h;cl+=t;const e=$('#ot'+i);if(e)e.textContent=fmt(t)+' L';const q=$('#tt'+i);if(q)q.textContent=(o.itens||[]).filter(x=>x.nome||x.dose).map(x=>(x.nome||'Produto')+': '+fmt(n(x.dose)*h)+' '+(x.un||'L/ha').replace('/ha','')).join('  |  ')||'O total de cada produto aparece aqui'});

ck('c',R.cliente);ck('a',R.data&&R.cultura);ck('o',ha>0&&R.ops.some(o=>(o.itens||[]).some(i=>i.nome)));ck('v',n(R.vha)>0);ck('m',R.mapas.length,R.mapas.length+' mapa(s)');ck('f',R.fotos.length,R.fotos.length+' foto(s)');

async function build(p){const R=GD=='orc'?S.Q:S.R,base=((GD=='orc'?'Orcamento_':'Relatorio_')+R.num+'_'+nz(R.cliente||'cliente')).replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,''),pdf=p.fmt=='pdf',jpg=pdf||p.img=='jpg',mime=jpg?'image/jpeg':'image/png',ext=jpg?'jpg':'png';

async function stitch(J,mime){const ims=await Promise.all(J.map(j=>new Promise(r=>{const u=URL.createObjectURL(new Blob([j.jp],{type:mime})),im=new Image();im.onload=()=>r({im,u});im.onerror=()=>r({im,u});im.src=u})));
const w=J[0].width,h=J.reduce((a,j)=>a+j.height,0),s=Math.min(1,Math.sqrt(15e6/(w*h)),15000/h),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);let y=0;
ims.forEach(({im,u},i)=>{x.drawImage(im,0,y*s,c.width,J[i].height*s);if(i){x.fillStyle=BD;x.fillRect(0,y*s,c.width,2)}y+=J[i].height;URL.revokeObjectURL(u)});
const b=await new Promise(r=>c.toBlob(r,mime,.92));c.width=c.height=0;return b}

3. CONDIÇÕES CLIMÁTICAS — A aplicação depende de condições adequadas de vento, temperatura e umidade. Em caso de condições desfavoráveis, a data será reagendada sem custo, de comum acordo entre as partes.
4. PRODUTOS E CALDA — A responsabilidade pela aquisição, qualidade, recomendação técnica e dose dos produtos é do contratante, salvo se estiver expressamente incluída neste orçamento.
5. ÁREA APLICADA — O valor final será calculado pela área efetivamente aplicada, conforme registro do equipamento, respeitada a área contratada.
6. PAGAMENTO — O pagamento deverá ser feito na forma e nos prazos indicados. Atrasos poderão sofrer multa e juros conforme a legislação vigente.
7. CANCELAMENTO — Cancelamentos ou alterações devem ser comunicados com antecedência mínima de 48 horas.
8. FORO — Fica eleito o foro da comarca do prestador para dirimir eventuais dúvidas oriundas deste contrato.`;

async function sha(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].slice(0,16).map(v=>v.toString(16).padStart(2,'0')).join('')}
async function auth(body,grant){const r=await fetch(SBU+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||('erro '+r.status));e.status=r.status;e.auth=true;throw e}
SESS={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||(SESS&&SESS.email)||''};await dbs('sess',SESS);return SESS}
async function token(){if(!SESS){const e=new Error('sem sessão');e.auth=true;throw e}if(Date.now()>SESS.exp-60000)await auth({refresh_token:SESS.refresh},'refresh_token');return SESS.access}
async function api(path,o={},retry=1){const t=await token(),r=await fetch(SBU+path,{...o,headers:{apikey:SBK,Authorization:'Bearer '+t,...(o.headers||{})}});if(r.status==401&&retry){SESS.exp=0;return api(path,o,0)}return r}
async function chk(r){if(r.ok)return r;const e=new Error(r.status+' '+(await r.text().catch(()=>'')).slice(0,200));e.status=r.status;e.auth=r.status==401;throw e}
async function upl(h,src){if(UPL.has(h))return;const b=await(await fetch(src)).blob();await chk(await api('/storage/v1/object/media/'+h,{method:'POST',headers:{'Content-Type':b.type||'image/jpeg','x-upsert':'true'},body:b}));UPL.add(h);dbs('upl',[...UPL])}
async function dl(h){const b=await(await chk(await api('/storage/v1/object/authenticated/media/'+h))).blob();return new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}
async function pack(o,kind){const c=JSON.parse(JSON.stringify(o));
const one=async x=>{if(!x.src)return x;x.h=x.h||await sha(x.src);await upl(x.h,x.src);delete x.src;return x};
if(kind=='rel')for(const k of['fotos','mapas'])c[k]=await Promise.all((c[k]||[]).map(one));
if(kind=='cfg'&&c.logo){c.logoH=await sha(c.logo);await upl(c.logoH,c.logo);delete c.logo}return c}
async function unpack(d,old){const c=JSON.parse(JSON.stringify(d));
const one=async(x,oa)=>{if(!x.h||x.src)return x;const o=(oa||[]).find(y=>y.h==x.h&&y.src);x.src=o?o.src:await dl(x.h);return x};
for(const k of['fotos','mapas'])if(c[k])c[k]=await Promise.all(c[k].map(x=>one(x,old&&old[k])));
if(c.logoH){c.logo=(old&&old.logo&&await sha(old.logo)==c.logoH)?old.logo:await dl(c.logoH);delete c.logoH}return c}
async function push(){for(const id of Object.keys(PQ)){const k=PQ[id],v=PV[id];let row;
if(String(k)=='del')row={id,kind:id[0]=='r'?'rel':'orc',data:{},deleted:true};
else if(id=='cfg'){if(!S.C.ts){delete PQ[id];continue}row={id,kind:'cfg',data:await pack(S.C,'cfg'),deleted:false}}
else if(id[0]=='r'){const r=await dbg(id);if(!r){delete PQ[id];continue}row={id,kind:'rel',data:await pack(r,'rel'),deleted:false}}
else{const q=OQ[id.slice(2)];if(!q){delete PQ[id];continue}row={id,kind:'orc',data:q,deleted:false}}
row.updated_at=new Date().toISOString();
const pr=await(await chk(await api('/rest/v1/docs?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)}))).json();if(pr&&pr[0]){SU[id]=pr[0].updated_at;await dbs('su',SU)}
if(PV[id]===v){delete PQ[id];delete PV[id]}await dbs('pq',PQ)}}
async function applyDoc(d){const id=d.id,pre=id.slice(0,2),key=id.slice(2);if(PQ[id])return;
if(id=='cfg'){if(d.deleted)return;S.C=await unpack(d.data,S.C);await dbs('co',S.C);syncF();rLogo();return}
if(pre=='r:'){const loc=IX[key];
if(d.deleted){if(loc){await dbd(id);delete IX[key];await dbs('ix',IX);if(S.R.id==key&&!DIRTY){S.R=await mk();fill();await dbs('draft',S.R)}}}
else{if(S.R.id==key&&DIRTY)return;const old=await dbg(id),r=norm(await unpack(d.data,old));await dbs(id,r);IX[key]=lite(r);await dbs('ix',IX);if(S.R.id==key){S.R=r;fill();await dbs('draft',r)}}}
else if(pre=='q:'){const loc=OQ[key];
if(d.deleted){if(loc){delete OQ[key];await dbs('orc',OQ);if(S.Q.id==key&&!DQ){S.Q=await mkQ();qfill();await dbs('qdraft',S.Q)}}}
else{if(S.Q.id==key&&DQ)return;const q=normQ(JSON.parse(JSON.stringify(d.data)));OQ[key]=q;await dbs('orc',OQ);if(S.Q.id==key){S.Q=normQ(JSON.parse(JSON.stringify(q)));qfill();await dbs('qdraft',S.Q)}}}
else return;
rDL();rQN();if(TB=='b'||TB=='r')draw();if(TB=='q'&&QS=='l')rQL()}
async function pull(){const list=[];for(let off=0;;off+=1000){const rows=await(await chk(await api('/rest/v1/docs?select=id,updated_at&order=id.asc&limit=1000&offset='+off))).json();list.push(...rows);if(rows.length<1000)break}
const need=list.filter(r=>SU[r.id]!==r.updated_at&&!PQ[r.id]).map(r=>r.id);
for(let i=0;i<need.length;i+=15){const ids=need.slice(i,i+15),rows=await(await chk(await api('/rest/v1/docs?select=*&id=in.'+encodeURIComponent('('+ids.map(x=>'"'+x+'"').join(',')+')')))).json();for(const d of rows){await applyDoc(d);SU[d.id]=d.updated_at;await dbs('su',SU)}}}
async function sync(manual){if(!SESS||!STARTED)return;if(SYN){SAG=1;return}SYN=1;cloud('sincronizando…');
try{if(!navigator.onLine)throw new TypeError('offline');
